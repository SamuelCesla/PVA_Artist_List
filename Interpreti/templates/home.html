{% load static %}

<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artist List</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/styles.css' %}"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Artist List
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row">

        {% for interpret in interpreti %}

        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow">

                <a
                    href="/interpret/{{ interpret.interpret_id }}/"
                    class="text-decoration-none text-dark"
                >

                    {% if interpret.foto %}

                        <img
                            src="{{ interpret.foto.url }}"
                            class="card-img-top"
                        >

                    {% endif %}

                    <div class="card-body">

                        <h3 class="card-title">

                            {{ interpret.jmeno }}
                            {{ interpret.prijmeni }}

                        </h3>

                        <p class="card-text">

                            {{ interpret.label }}

                        </p>

                    </div>

                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
